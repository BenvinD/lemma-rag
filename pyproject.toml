[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lemma-rag"
version = "0.1.0"
description = "Enterprise RAG with hybrid search (BM25 + vector), cross-encoder reranking, and bidirectional guardrails"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "langchain>=0.1.0",
    "sentence-transformers>=2.2.2",
    # Required by fastapi.testclient.TestClient; previously only present as a
    # transitive dep, which is why CI failed with ModuleNotFoundError.
    "httpx>=0.25.1",
]

# Dev tooling is a dependency-group, not an extra: it is installed by
# `uv sync` and never published as part of the distribution.
[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "types-setuptools>=69.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "RUF"]
ignore = ["E501"]  # Line too long - handled by formatter

[tool.ruff.format]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
explicit_package_bases = true
mypy_path = "src"
exclude = ["tests/"]

# Per-module `ignore_missing_imports` overrides go here as untyped third-party
# packages are actually imported. Adding them pre-emptively makes mypy report
# "unused section(s)" on every run.

[tool.pytest.ini_options]
testpaths = ["tests"]
# No `pythonpath` entry on purpose. With a src/ layout the tests must import
# the *installed* package; putting src/ on sys.path here would defeat that and
# let a broken build pass. Run `uv sync` (which installs the project) first.
addopts = "--cov=lemma_rag --cov-report=term-missing --strict-markers"
asyncio_mode = "auto"
