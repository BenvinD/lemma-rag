# The pinned corpus: three sources, one per input format (~130 documents).
# Everything is versioned, so `lemma fetch` is reproducible.

raw_dir = "data/raw"
# arXiv asks API clients to identify themselves.
user_agent = "lemma-rag/0.1 (+https://github.com/BenvinD/lemma-rag)"

[fastapi]  # Markdown
tag = "0.141.1"
include = ["tutorial/**/*.md"]

[pydocs]  # HTML
version = "3.14"
pages = [
    "library/asyncio-task", "library/asyncio-eventloop", "library/asyncio-queue",
    "library/asyncio-sync", "library/asyncio-subprocess", "library/asyncio-stream",
    "library/typing", "library/dataclasses", "library/functools", "library/itertools",
    "library/collections", "library/collections.abc", "library/contextlib", "library/abc",
    "library/enum", "library/pathlib", "library/os.path", "library/shutil",
    "library/tempfile", "library/json", "library/csv", "library/sqlite3", "library/re",
    "library/string", "library/textwrap", "library/logging", "library/logging.config",
    "library/argparse", "library/datetime", "library/zoneinfo", "library/threading",
    "library/multiprocessing", "library/concurrent.futures", "library/subprocess",
    "library/urllib.parse", "library/unittest", "library/unittest.mock",
    "library/timeit", "library/heapq", "library/bisect", "library/weakref",
    "library/pickle", "library/hashlib", "library/secrets", "library/random",
    "library/statistics", "library/decimal", "library/inspect", "library/tomllib",
    "library/graphlib",
]

